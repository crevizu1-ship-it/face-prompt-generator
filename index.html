<header><div class="eyebrow">FACE DATASET STUDIO</div><h1>얼굴 학습 프롬프트 생성기</h1><p class="muted">Midjourney · 캐릭터 얼굴 학습용 랜덤 프롬프트</p></header>
<div class="metrics" id="metrics"></div>
<section>
  <h2>01 · 생성 설정</h2>
  <div class="controls">
    <div>
      <label for="count">프롬프트 개수</label>
      <input id="count" type="number" min="1" max="200" value="20">
      <div class="quick"><button data-count="10">10</button><button data-count="30">30</button><button data-count="50">50</button><button data-count="100">100</button></div>

    <div>

      <input id="ratio" type="range" min="0" max="100" step="5" value="80" aria-describedby="estimate">
      <p id="estimate" class="muted"></p>
    </div>
    <fieldset class="environment">
      <legend>배경에 맞춰 자동 선택</legend>
      <div class="actions">
        <label><input id="useWeather" type="checkbox" checked> 날씨</label>
        <label><input id="useTime" type="checkbox" checked> 시간대</label>
        <label><input id="useLighting" type="checkbox" checked> 조명</label>
      </div>
      <p class="muted">날씨는 실외와 창가 배경에만 적용됩니다.</p>
    </fieldset>
    <div>
      <label for="frameRatio">촬영 구도 · 얼굴 클로즈업 비율 <span class="ratio" id="frameLabel"></span></label>
      <input id="frameRatio" type="range" min="0" max="100" value="70" aria-describedby="frameEstimate">
      <p id="frameEstimate" class="muted"></p>
    </div>
  </div>
  <details class="advanced"><summary>공통 프롬프트 / 파라미터</summary>
    <div class="inside">
      <label for="prefix">공통 프롬프트</label><textarea id="prefix">photorealistic, consistent facial features</textarea>
      <label for="suffix">촬영 조건</label><textarea id="suffix">natural skin texture</textarea>
      <label for="params">미드저니 파라미터 (필요시 수정)</label><textarea id="params">--raw --s 0 --c 0 --ar 1:1</textarea>
    </div>
  </details>
</section>
<h2>02 · 스타일 라이브러리</h2><div id="libraries"></div><button id="generate" class="primary">랜덤 프롬프트 생성</button>

function environmentFor(background, options) {
  if (!background.group) return [];
  const pool = scenes[background.group];
  const {weather, time, lighting} = pool[Math.floor(Math.random() * pool.length)];
  return [
    options.weather && weather,
    options.time && time,
    options.lighting && lighting,
  ].filter(Boolean);

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function build(groups, n, neutralTotal, closeTotal, options) {
  const [hair, angle, outfit, expression, background] = groups;
  const styles = [hair, angle, outfit].map(group => balanced(group, n));
  const expressions = shuffle([...Array(neutralTotal).fill(neutral), ...balanced(expression, n - neutralTotal)]);
  const frames = shuffle([...Array(closeTotal).fill(closeUp), ...Array(n - closeTotal).fill(waistUp)]);
  const backgrounds = background.length ? balanced(background, n) : Array(n).fill(noBackground);
  return Array.from({length:n}, (_, i) => {
    const items = [frames[i], ...styles.map(column => column[i]), expressions[i], backgrounds[i]];
    const environment = environmentFor(backgrounds[i], options);
    const parts = [...items, ...environment].map(item => item.en);
    const description = [options.prefix, ...parts, options.suffix].filter(Boolean).join(', ');
    return {items, environment, text: [description, options.params].filter(Boolean).join(' ')};
  });
}

const neutral={ko:'무표정',en:'neutral facial expression, relaxed facial muscles, closed lips'};
const $=id=>document.getElementById(id);let output=[];
const make=(tag,cls,txt)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const selected=g=>g.items.filter(x=>x.enabled);
function metrics(){ $('metrics').replaceChildren();for(const g of library){const m=make('div','metric');m.append(make('strong','',selected(g).length+(g.name==='미세 표정'?1:0)),make('span','muted',g.name==='미세 표정'?'표정 (무표정 포함)':g.name));$('metrics').append(m);$('sel-'+g.id).textContent=selected(g).length+'/'+g.items.length+' 선택';}}
for(const g of library){const d=make('details'),s=make('summary','',g.name),n=make('span','selection');n.id='sel-'+g.id;s.append(n);d.append(s);const body=make('div','inside'),actions=make('div','actions'),choices=make('div','choices'),checks=[];for(const item of g.items){const l=make('label','choice'),cb=make('input'),t=make('span','',item.ko);cb.type='checkbox';cb.checked=item.enabled;cb.onchange=()=>{item.enabled=cb.checked;metrics()};checks.push(cb);t.append(make('small','',item.en));l.append(cb,t);choices.append(l)}for(const [txt,val] of [['전체 선택',true],['전체 해제',false]]){const b=make('button','',txt);b.onclick=()=>{g.items.forEach((x,i)=>{x.enabled=val;checks[i].checked=val});metrics()};actions.append(b)}if(g.id===4)body.append(make('p','muted','단색·실내·실외 배경을 선택할 수 있습니다. 전체 해제하면 배경 프롬프트가 생략됩니다.'));body.append(actions,choices);d.append(body);$('libraries').append(d)}
function count(){return Math.max(1,Math.min(200,Math.floor(Number($('count').value)||1)))}
function neutralCount(){return Math.round(count()*Number($('ratio').value)/100)}
function estimate(){ $('ratioLabel').textContent=$('ratio').value+'%';$('estimate').textContent='무표정 '+neutralCount()+'개 · 미세 표정 '+(count()-neutralCount())+'개';}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function balanced(a,n){if(!a.length&&n)throw Error('Empty library');let b=[];while(b.length<n)b.push(...shuffle(a));return b.slice(0,n)}
function build(groups,n,k,prefix,suffix,params){const [h,a,c,e,b]=groups;const expressions=shuffle([...Array(k).fill(neutral),...balanced(e,n-k)]);const backgrounds=b.length?balanced(b,n):Array(n).fill({ko:'배경 미지정',en:''});const cols=[balanced(h,n),balanced(a,n),balanced(c,n),expressions,backgrounds];return Array.from({length:n},(_,i)=>{const items=cols.map(col=>col[i]);const desc=[prefix,...items.map(x=>x.en),suffix].filter(Boolean).join(', ');return {items,text:[desc,params].filter(Boolean).join(' ')}})}
async function copy(text){try{await navigator.clipboard.writeText(text);$('status').textContent='복사 완료';return}catch{}const t=make('textarea');t.value=text;document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();$('status').textContent=ok?'복사 완료':'복사가 제한되어 있습니다. 결과를 선택해 복사하거나 TXT로 저장하세요.'}
function generate(){const n=count(),k=neutralCount(),g=library.map(selected);$('count').value=n;estimate();if(g.slice(0,3).some(a=>!a.length)||(k<n&&!g[3].length)){$('status').textContent='필요한 카테고리에서 하나 이상 선택하세요.';return}output=build(g,n,k,$('prefix').value.trim(),$('suffix').value.trim(),$('params').value.trim());$('results').replaceChildren();output.forEach((o,i)=>{const r=make('div','result-row'),body=make('div'),b=make('button','copy','복사');body.append(make('div','tagline',o.items.map(x=>x.ko).join(' · ')),make('div','prompt',o.text));b.onclick=()=>copy(o.text);r.append(make('div','muted',String(i+1).padStart(2,'0')),body,b);$('results').append(r)});$('info').textContent=n+'개 생성 · 무표정 '+k+'개 · 미세 표정 '+(n-k)+'개';$('status').textContent='';$('results').scrollTop=0}
$('generate').onclick=generate;$('ratio').oninput=estimate;$('count').oninput=estimate;document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{$('count').value=b.dataset.count;estimate()});$('copyAll').onclick=()=>{if(output.length)copy(output.map(x=>x.text).join('\n\n'))};$('save').onclick=()=>{if(!output.length)return;const url=URL.createObjectURL(new Blob([output.map(x=>x.text).join('\n\n')],{type:'text/plain;charset=utf-8'}));const a=make('a');a.href=url;a.download='face-prompts.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};metrics();estimate();generate();
